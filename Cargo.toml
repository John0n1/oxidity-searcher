[package]
name = "oxidity-searcher"
version = "0.1.1-delta"
edition = "2024"
authors = ["https://oxidity.io | John Hauger Oxidity"]
description = "Oxidity Searcher is a MEV-Searcher on The Ethereum Mainnet chain"
homepage = "https://oxidity.io/"
repository = "https://github.com/John0n1/oxidity-searcher"
readme = "README.md"
license = "MIT"
categories = ["cryptography::cryptocurrencies"]
default-run = "oxidity-searcher"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"

serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1.0.151"

config = "0.15.25"
dotenvy = "0.15.7"
quinn-proto = ">=0.11.16" 
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt", "registry", "parking_lot"] }

thiserror = "2.0.19"
anyhow = "1.0.104"

alloy = { version = "2.2.0", default-features = false, features = [
    "std",
    "reqwest-native-tls",
    "consensus",
    "contract",
    "eips",
    "network",
    "provider-debug-api",
    "provider-http",
    "provider-ipc",
    "provider-ws",
    "rpc-types-eth",
    "rpc-types-trace",
    "serde",
    "signer-local",
    "sol-types",
] }

alloy-consensus = { version = "2.2.0", features = ["serde", "k256"] }
alloy-primitives = { version = "1.6.1", features = ["serde"] }
alloy-json-abi = "1.6.1"
alloy-sol-types = "1.6.1"
alloy-rpc-client = "2.2.0"
alloy-rpc-types-engine = "2.2.0"
alloy-transport-http = { version = "2.2.0", features = ["jwt-auth"] }

sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-native-tls", "sqlite", "chrono", "migrate"] }
chrono = { version = "0.4.45", features = ["serde"] }

dashmap = "6.2.1"
futures = "0.3.33"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
url = "2.5.8"
hex = "0.4.3"
once_cell = "1.21.4"
clap = { version = "4.6.5", features = ["derive"] }

[dev-dependencies]
regex = "1.13.1"

[package.metadata.cargo-machete]
ignored = ["alloy-primitives"]